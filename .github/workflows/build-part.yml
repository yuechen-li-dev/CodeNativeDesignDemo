name: Build engineering artifacts

on:
  push:
    branches: [main]
    paths-ignore: ['parts/**', 'scripts/build_parts.py', '.github/workflows/parts.yml', 'AGENTS.md']
  pull_request:
    paths-ignore: ['parts/**', 'scripts/build_parts.py', '.github/workflows/parts.yml', 'AGENTS.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bracket:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the exact PR base for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dependencies/base-demo
          persist-credentials: false
      - name: Read compiler pin
        id: compiler
        shell: pwsh
        run: |
          $pin = (Get-Content aetheris-revision.txt -Raw).Trim()
          if ($pin -notmatch '^[0-9a-f]{40}$') { throw 'Invalid Aetheris revision.' }
          "revision=$pin" >> $env:GITHUB_OUTPUT
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = (Get-Content dependencies/base-demo/aetheris-revision.txt -Raw).Trim()
            if ($base -notmatch '^[0-9a-f]{40}$') { throw 'Invalid base compiler revision.' }
            "base=$base" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/Aetheris
          ref: ${{ steps.compiler.outputs.revision }}
          path: dependencies/aetheris
          persist-credentials: false
      - name: Checkout historical compiler for the upgrade control
        if: github.event_name == 'pull_request' && steps.compiler.outputs.base != steps.compiler.outputs.revision
        uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/Aetheris
          ref: ${{ steps.compiler.outputs.base }}
          path: dependencies/base-aetheris
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install PDF preview renderer
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Read managed compiler dependency pin
        id: wgsl
        shell: pwsh
        run: |
          $pin = (Get-Content dependencies/aetheris/scripts/managed-wgsl-commit-pin.txt -Raw).Trim()
          if ($pin -notmatch '^[0-9a-f]{40}$') { throw 'Invalid managed compiler revision.' }
          "revision=$pin" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: yuechen-li-dev/Copeland
          ref: ${{ steps.wgsl.outputs.revision }}
          path: dependencies/copeland
          persist-credentials: false
      - name: Prepare source-pinned dependency
        shell: pwsh
        working-directory: dependencies/aetheris
        run: |
          ./scripts/prepare-managed-wgsl.ps1 -CopelandRoot "$env:GITHUB_WORKSPACE/dependencies/copeland"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency preparation failed.' }
          if (Test-Path ../base-aetheris) {
            $oldPin = (Get-Content ../base-aetheris/scripts/managed-wgsl-commit-pin.txt -Raw).Trim()
            if ($oldPin -ne '${{ steps.wgsl.outputs.revision }}') { throw 'Historical compiler needs a separately pinned dependency checkout.' }
            ../base-aetheris/scripts/prepare-managed-wgsl.ps1 -CopelandRoot "$env:GITHUB_WORKSPACE/dependencies/copeland"
            if ($LASTEXITCODE -ne 0) { throw 'Historical dependency preparation failed.' }
          }
      - name: Check bracket compiler regressions
        shell: pwsh
        working-directory: dependencies/aetheris
        run: |
          dotnet build Aetheris.Kernel.Firmament.Tests -c Release -m:1 -nr:false -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Regression test build failed.' }
          dotnet test Aetheris.Kernel.Firmament.Tests -c Release --no-build -m:1 -nr:false --filter "FullyQualifiedName~ComposedHoleFamilyTests|FullyQualifiedName~CodeNativeBracketRehearsalTests|FullyQualifiedName~PrismaticSectionStackHoleTraversalTests|FullyQualifiedName~CodeNativeAssemblyRehearsalTests" --logger "trx;LogFileName=bracket.trx" --results-directory "$env:GITHUB_WORKSPACE/artifacts/local/tests" -- RunConfiguration.MaxCpuCount=1
          if ($LASTEXITCODE -ne 0) { throw 'Bracket regressions failed.' }
      - name: Build, export, and reconstruct from PDF alone
        shell: pwsh
        run: ./scripts/Qualify.ps1
      - name: Build historical parts with the proposed compiler
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          ./scripts/Qualify.ps1 -DesignRoot "$env:GITHUB_WORKSPACE/dependencies/base-demo" -PartsOnly -CompilerControl -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/local/base-build"
      - name: Qualify the compiler upgrade against the historical compiler
        if: github.event_name == 'pull_request' && steps.compiler.outputs.base != steps.compiler.outputs.revision
        shell: pwsh
        run: |
          ./dependencies/base-demo/scripts/Qualify.ps1 -AetherisRoot "$env:GITHUB_WORKSPACE/dependencies/base-aetheris" -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/local/base-original"
          python scripts/compare_compiler.py --before artifacts/local/base-original/deliverables --after artifacts/local/base-build/deliverables --output artifacts/local/compiler-control.json
          if ($LASTEXITCODE -ne 0) { throw 'Compiler upgrade changed historical artifacts.' }
      - name: Compare actual base and proposed artifacts
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/compare_revision.py
          --before artifacts/local/base-build/deliverables
          --after artifacts/local/build/deliverables
          --output artifacts/local/review
          --font dependencies/aetheris/Aetheris.Kernel.Firmament/Resources/Inter-Regular.ttf
      - name: Include compiler control in the review pack
        if: github.event_name == 'pull_request' && steps.compiler.outputs.base != steps.compiler.outputs.revision
        shell: pwsh
        run: Copy-Item artifacts/local/compiler-control.json artifacts/local/review/compiler-control.json
      - name: Upload before/after review pack
        if: github.event_name == 'pull_request'
        id: review
        uses: actions/upload-artifact@v4
        with:
          name: review-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: artifacts/local/review/
          if-no-files-found: error
          retention-days: 30
      - name: Link review pack in run summary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          REVIEW_URL: ${{ steps.review.outputs.artifact-url }}
        run: echo "[Download the before/after review pack]($REVIEW_URL) — open index.html after extracting." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload qualified parts and assemblies
        id: deliverables
        uses: actions/upload-artifact@v4
        with:
          name: bracket-${{ github.sha }}
          path: artifacts/local/build/deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Link engineering artifacts
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.deliverables.outputs.artifact-url }}
        run: echo "[Download qualified assembly STEP/glTF and bracket PDF drawings]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.sha }}
          path: artifacts/local/tests/
          if-no-files-found: warn
